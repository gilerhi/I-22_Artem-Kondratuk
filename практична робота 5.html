<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Розклад руху автобусів</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        h2 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }
        /* Верхня частина таблиці (thead) */
        thead th {
            background-color: #2c3e50;
            color: #ffffff;
        }
        /* Підсумкова частина таблиці (tfoot) */
        tfoot td {
            background-color: #ecf0f1;
            font-weight: bold;
            text-align: right;
            padding-right: 20px;
        }
    </style>
</head>
<body>

    <h2>Розклад руху автобусів</h2>

    <table>
        <thead>
            <tr>
                <th rowspan="2">Номер маршруту</th>
                <th rowspan="2">Місце відправлення</th>
                <th rowspan="2">Місце прибуття</th>
                <th colspan="2">Час</th>
            </tr>
            <tr>
                <th>Час відправлення</th>
                <th>Час прибуття</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="3">101А</td>
                <td rowspan="3">Луцьк</td>
                <td rowspan="3">Львів</td>
                <td>08:00</td>
                <td>10:30</td>
            </tr>
            <tr>
                <td>12:15</td>
                <td>14:45</td>
            </tr>
            <tr>
                <td>16:30</td>
                <td>19:00</td>
            </tr>
            <tr>
                <td rowspan="2">205</td>
                <td rowspan="2">Луцьк</td>
                <td rowspan="2">Рівне</td>
                <td>09:00</td>
                <td>10:15</td>
            </tr>
            <tr>
                <td>14:00</td>
                <td>15:15</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="5">Всього рейсів: 5</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
